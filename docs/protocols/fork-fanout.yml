# Single source of truth for the SotD renderer's Fan-out section (PL-032). The fork RECIPE
# (per-repo trim/validate steps) is uniform across brand slots and lives once in `recipe` below;
# per-slot `status` + `note` track live progress. Update a slot when its trim advances (e.g. a
# sibling trim lands its PR). The 0711 petey-plan enumerates only the five sibling repos + generic
# C1–C6/D1–D3 steps and carries no per-slot live status, so this structured file — not the plan
# prose — is the canonical fan-out source the renderer reads.
#
# status vocabulary: done · in-progress · pending · n-a · created
