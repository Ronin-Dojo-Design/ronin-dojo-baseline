    repo: ""
    body: |-
      <section>
        <h2>Where the fork stands</h2>
        <p style="font-size:13.5px;margin:0 0 10px">Seven portfolio slots: <strong>five sibling repos</strong> on GitHub (forked at <code>ecefd008</code> with full shared
        history) plus <strong>ACD</strong> (ratified brand, no repo yet) and <strong>Tuff Buffs</strong> (white-label instance of Baseline, being absorbed). <strong>black-belt-legacy is the only one trimmed</strong> (SESSION_0712, PR #343 — merge held for green CI + operator word).
        <strong>No sibling has a local clone yet.</strong> Every repo already has the <code>main-pr-only</code> server ruleset (done 0712) and,
        once PR #343's <code>settings.shared.json</code> commit is cherry-picked/merged into each, the bow-in-gates hook registration survives
        fresh clones via bootstrap.</p>
        <ul class="order">
          <li><span class="n">1</span><div><strong>black-belt-legacy</strong> — finish the landing: CI green → squash-merge PR #343 → Phase D (fresh-clone build · Vercel preview · smoke). <span class="pill pill-accent" data-repo="bbl" style="background:hsl(1 79% 51%)">Phase C done</span></div></li>
          <li><span class="n">2</span><div><strong>mammoth-metal-buildings</strong> — next session: clone + trim. The 2026-08-05 client cutover (PL-024, MVP due 08-07) makes it first among the siblings. Its rescued <code>.env</code> is parked at <code>~/dev/_secrets-parking/mammoth-build-crm/</code>.</div></li>
          <li><span class="n">3</span><div><strong>baseline-martial-arts</strong> — clone + trim (same recipe, roles reversed: keep <code>apps/baseline</code>, delete <code>apps/web</code>).</div></li>
          <li><span class="n">4</span><div><strong>usa-stickfighting</strong> — clone + trim; lightest repo (keeps the WEKAF kits; also adopt the 3 WEKAF brand-kit PNGs still tracked in BBL).</div></li>
          <li><span class="n">5</span><div><strong>rdd-monorepo</strong> — clone only, NO trim (keeps everything; upstream-of-record). Cherry-pick the 0712 process-OS commits down; start the weekly RDD sync cadence.</div></li>
          <li><span class="n">6</span><div><strong>ACD — Amy Coaches Data</strong> — ratified brand slot (ADR 0051, amycoachesdata.com) with <strong>no repo, no app, no code yet</strong> — nothing existed to fork. Its lane starts with a brand-scope decision, not a trim.</div></li>
          <li><span class="n">7</span><div><strong>Tuff Buffs</strong> — <strong>white-label instance of Baseline</strong> (ADR 0051: transitional, being absorbed — not a peer repo). WordPress today; becomes a Baseline-skinned app (own deploy + DB) after Baseline's trim lands.</div></li>
        </ul>
        <h3>The invariant per-repo sequence (ADR 0059: session = one repo)</h3>
        <div class="fladder">
          <span class="fstop done">Clone</span><span class="fstop done">Bootstrap</span>
          <span class="fstop done">C1 apps</span><span class="fstop done">C2 docs</span><span class="fstop done">C3 CI</span>
          <span class="fstop done">C4 router</span><span class="fstop done">C5 era</span><span class="fstop done">C6 ADR</span>
          <span class="fstop now">D1 build</span><span class="fstop now">D2 preview</span><span class="fstop now">D3 smoke</span>
        </div>
        <p class="muted">Black = proven once (this session, BBL). Accent = still to prove. Ratified calls that carry to every sibling:
        fork-don't-rewrite (ordinary <code>git rm</code>, never filter-repo) · monotonic session numbers, era via <code>sprint:</code> (N1) ·
        ADRs 0055+ one global sequence · full Graphify rebuild after the trim (incremental keeps phantoms).</p>
      </section>
