# Fork Fan-out Board — per-slot brand-repo separation status (ADR 0055 / 0059).
#
# Single source of truth for the SotD renderer's Fan-out TAB (PL-032). This drives the 8-sub-tab
# board (#fanout-root) the operator hand-built at SESSION_0712: an Overview panel + one panel per
# portfolio slot (BBL · Mammoth · Baseline · USA-Stick · RDD-Mono · ACD · Tuff Buffs). Each panel's
# `body` is the verbatim inner HTML of its `.fpanel` — bespoke narrative (keep/kill, Phase-C step
# tables, ordered next-steps) that regenerates deterministically because it lives here as DATA.
#
# WHY BLOCK SCALARS (`|-`), not quoted flow scalars: `Bun.YAML.parse` treats an unquoted ` #` in a
# FLOW scalar as an inline comment and SILENTLY truncates (a `#343` PR ref would drop the rest —
# Desi/Doug, SESSION_0714, see FAILED_STEPS). Inside a block scalar, `#` and `"` are LITERAL — no
# comment processing, no quote-escaping. Every HTML body below is a block scalar for exactly this
# reason. Frozen at SESSION_0712; hand-edit a panel's `body` when a sibling lands its trim.
title: Fork Fan-out Board
plan: docs/sprints/plans/petey-plan-0711-brand-repo-separation.md
meta: |-
  Fork Fan-out Board — what each portfolio slot still needs (ADR 0055/0059) · frozen at SESSION_0712 · plan of record: <code>docs/sprints/plans/petey-plan-0711-brand-repo-separation.md</code>
# Sub-tab order (left→right). `repo` sets the #fanout-root accent when the panel is active
# (overview borrows rdd's graphite). Panels are matched to tabs by `key`.
tabs:
  - { key: overview, label: Overview, repo: rdd }
  - { key: bbl, label: BBL, repo: bbl }
  - { key: mmb, label: Mammoth, repo: mmb }
  - { key: bma, label: Baseline, repo: bma }
  - { key: usa, label: USA-Stick, repo: usa }
  - { key: rdd, label: RDD-Mono, repo: rdd }
  - { key: acd, label: ACD, repo: acd }
  - { key: tb, label: Tuff Buffs, repo: tb }
panels:
  - key: overview
