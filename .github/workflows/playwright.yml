name: Playwright E2E

# SESSION_0267_FINDING_02 closure: the playwright.config.ts cross-browser
# project additions from SESSION_0266 have never been exercised on CI
# because no GitHub Actions workflow existed. This workflow runs the
# chromium full suite + firefox/webkit lineage subset on every PR, every
# push to main, and on demand.

on:
  # SESSION_0718 (lane 1, required-check gate): workflow-level `paths-ignore`
  # removed so the `Playwright complete` job always reports and can be a required check
  # without deadlocking docs-only PRs (a path-skipped required check never
  # reports → forever-pending). The docs/agent/tooling skip moved INTO the
  # `changes` job below; the `test` matrix gates on it, so a docs-only PR still
  # runs zero Playwright minutes. Same ignore set as ci.yml, kept symmetric.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the e2e job only needs to read the repo (SESSION_0335
# security hardening — default GITHUB_TOKEN perms are broader than needed).
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SESSION_0718 (lane 1): replaces workflow-level paths-ignore (see `on:` note).
  # Same cheap always-run detector as ci.yml's `changes` job, kept in sync, so the
  # `Playwright complete` gate always reports. Fail-safe: run=true on any ambiguity.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        name: Determine if apps/web (non-ignored) paths changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # Only skip when EVERY changed file is docs/agent-context or root tooling
          # (docs/**, **.md, .claude/**, .github/copilot-instructions.md,
          # .github/prompts/**, scripts/** — none affect apps/web e2e, SESSION_0465).
          run=true
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "__ERR__")
          elif [ "$EVENT" = "push" ]; then
            files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || echo "__ERR__")
          else
            files="__ERR__"
          fi
          if [ "$files" != "__ERR__" ] && [ -n "$files" ]; then
            run=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|.claude/*|.github/copilot-instructions.md|.github/prompts/*|scripts/*|*.md) ;;
                *) run=true ;;
              esac
            done <<< "$files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Playwright e2e relevant to this change: run=$run"

  test:
    name: Playwright (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # SESSION_0268: split browsers into parallel single-worker jobs. This
    # keeps the useful cross-browser signal from SESSION_0267 while reducing
    # wall time versus one 30m serial job.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ronindojo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Required by env.ts t3-env validation
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ronindojo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ronindojo_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-32b
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_EMAIL: ci@ronindojo.test
      # Optional but consumed by some seed/auth paths
      CRON_SECRET: ci-cron-secret
      # SESSION_0718 down-sync (P1): e2e runs against a prod build (NODE_ENV=production), so
      # skip real email delivery — registration/claim specs read magic-link tokens straight
      # from the DB. Short-circuits sendEmail before its prod RESEND_API_KEY guard (lib/email.ts).
      EMAIL_E2E_TRANSPORT: noop
      # SESSION_0718 (lane 2): enable the belt-journey lifecycle spec in CI. The spec is
      # `RUN_BELT_E2E`-gated (operator-only smoke by default, Petey Plan 0477); setting it here
      # opts CI in. REQUIRES the lane-2 fixture reconcile (PR #358 — ADR 0058 RankEntry
      # read-collapse) to be on `main` FIRST, or belt-journey runs red against the un-reconciled
      # fixture. Do NOT flip the branch-protection ruleset to require Playwright until belt-journey
      # is green on `main`.
      RUN_BELT_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # `lib/i18n.ts` uses `fs.promises.glob` (Node 22+). Root
          # package.json declares `engines.node: ">=20"` but the code
          # actually requires 22+. Pinning 22 (LTS Jod) for CI.
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: apps/web

      - name: Apply Prisma migrations
        run: bunx prisma migrate deploy
        working-directory: apps/web

      # SESSION_0718 down-sync (P1): e2e runs against a PRODUCTION build, not the JIT dev
      # server. `next build` precompiles every route so playwright.config's webServer
      # (`next start` in CI) serves precompiled output with zero on-demand Turbopack
      # compilation — the root-cause fix for the sharded-chromium cold-compile
      # redirect-timeout flake. Job env (DATABASE_URL etc.) above feeds build-time DB access.
      - name: Build production bundle (e2e server)
        run: bun run build
        working-directory: apps/web
        # `next build` exceeds Node's default heap on the runner (V8 "Ineffective
        # mark-compacts near heap limit" → OOM). Raise the ceiling; mirrors ci.yml's
        # typecheck NODE_OPTIONS. Runner has 16 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.project }}
        working-directory: apps/web

      - name: Install Playwright OS deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.project }}
        working-directory: apps/web

      - name: Run Playwright tests
        # Chromium runs the full e2e/ tree; firefox + webkit run only e2e/lineage/
        # per playwright.config.ts per-project `testDir` scoping (SESSION_0266).
        run: bunx playwright test --project=${{ matrix.project }}
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7

      # SESSION_0334: ntfy.sh push on CI failure.
      # Requires the NTFY_TOPIC repo secret to be set:
      #   gh secret set NTFY_TOPIC
      # The `secrets` context isn't reliable inside step `if:`, so we gate only on
      # failure() here and skip inside the script when the topic is unset. Never
      # put a literal topic value in this file.
      - name: Notify on failure (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC secret unset — skipping ntfy notify."
            exit 0
          fi
          curl -fsS --max-time 15 \
            -H "Title: CI failed: Playwright (${{ matrix.project }})" \
            -H "Priority: 4" \
            -H "Tags: x,test_tube" \
            -d "Playwright ${{ matrix.project }} failed on ${{ github.ref_name }} (${{ github.sha }}). Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

  # SESSION_0718 (lane 1): the single stable REQUIRED status check for this
  # workflow (name matches the rdd-monorepo umbrella `Playwright complete`).
  # Always runs (if: always()), so it reports on EVERY PR — including docs-only
  # PRs where the `test` matrix skips (result=skipped, NOT a failure). Red iff a
  # real Playwright job failed. Require THIS name in the ruleset, not the per-
  # project matrix names (which are path-skipped). BBL keeps its single unsharded
  # [chromium, firefox, webkit] matrix — the umbrella's 4-shard split was
  # intentionally NOT ported (Doug, SESSION_0717: BBL ~28min < the 45min gate, no
  # correctness gain); revisit only if BBL e2e wall-time approaches the timeout.
  playwright-complete:
    name: Playwright complete
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Results via env, not inline `${{ }}` in `run:` (hardened form; zizmor).
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Verify no Playwright job failed
        run: |
          echo "changes=$CHANGES_RESULT test=$TEST_RESULT"
          # FAIL CLOSED (mirrors ci.yml's CI complete). The detector must have
          # SUCCEEDED — a failed `changes` skips the matrix and must not slip through
          # as a green gate that ran zero e2e. Then the `test` matrix must be `success`
          # or the intentional docs-only `skipped`; ANY other state (failure —
          # aggregate of a failed chromium/firefox/webkit leg — cancelled, or a
          # missing/unknown result) fails the gate.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Playwright complete: FAILED — the changes detector did not succeed (result=$CHANGES_RESULT)."
            exit 1
          fi
          if [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
            echo "Playwright complete: FAILED — a required Playwright job did not pass (result=$TEST_RESULT)."
            exit 1
          fi
          echo "Playwright complete: OK (all e2e passed or was a docs-only skip)."
